<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8.88s 盲按挑戰</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181b22;
      --text-main: #f3f4f6;
      --text-muted: #6b7280;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --perfect: #10b981;
      --close: #f59e0b;
      --fail: #ef4444;
      --border: #262a34;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* 計時器顯示區 */
    .timer-display {
      font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 20px 0 12px;
      line-height: 1;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .timer-display.masked {
      color: var(--text-muted);
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }

    /* 狀態評語與誤差 */
    .feedback-area {
      min-height: 48px;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .message {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .diff {
      font-family: "SF Mono", "Roboto Mono", monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* 主按鈕 */
    .action-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      background-color: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.08s ease;
      outline: none;
    }

    .action-btn:hover {
      background-color: var(--accent-hover);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .action-btn.running {
      background-color: var(--fail);
    }

    .action-btn.running:hover {
      background-color: #dc2626;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
      margin-bottom: 28px;
    }

    /* 紀錄面板 */
    .stats-container {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      text-align: left;
    }

    .best-record {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .best-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .best-value {
      font-family: "SF Mono", "Roboto Mono", monospace;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .history-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .history-list {
      list-style: none;
      max-height: 150px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-family: "SF Mono", "Roboto Mono", monospace;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .badge {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .badge.perfect { background: rgba(16, 185, 129, 0.15); color: var(--perfect); }
    .badge.close { background: rgba(245, 158, 11, 0.15); color: var(--close); }
    .badge.fail { background: rgba(239, 68, 68, 0.12); color: var(--text-muted); }

    /* 顏色輔助 */
    .text-perfect { color: var(--perfect); }
    .text-close { color: var(--close); }
    .text-fail { color: var(--fail); }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">TARGET 8.88s</div>
    <div class="subtitle">3 秒後進入盲猜，憑感覺在 8.88 秒按下停止</div>

    <div id="timer" class="timer-display">0.00</div>

    <div class="feedback-area">
      <div id="message" class="message">準備挑戰</div>
      <div id="diff" class="diff"></div>
    </div>

    <button id="actionBtn" class="action-btn">START</button>
    <div class="hint">可點擊按鈕或按 [空白鍵] 操作</div>

    <div class="stats-container">
      <div class="best-record">
        <span class="best-label">最佳紀錄 (最小誤差)</span>
        <span id="bestRecord" class="best-value">--</span>
      </div>

      <div class="history-title">近期紀錄</div>
      <ul id="historyList" class="history-list"></ul>
    </div>
  </div>

  <script>
    const TARGET_TIME = 8.88;
    const BLIND_THRESHOLD = 3.00; // 超過 3 秒後隱藏數字

    const timerEl = document.getElementById('timer');
    const messageEl = document.getElementById('message');
    const diffEl = document.getElementById('diff');
    const actionBtn = document.getElementById('actionBtn');
    const bestRecordEl = document.getElementById('bestRecord');
    const historyListEl = document.getElementById('historyList');

    let isRunning = false;
    let startTime = 0;
    let rafId = null;
    let bestDiff = Infinity;
    let bestTimeStr = '';
    let attemptCount = 0;

    function updateDisplay() {
      if (!isRunning) return;

      const elapsed = (performance.now() - startTime) / 1000;

      if (elapsed < BLIND_THRESHOLD) {
        timerEl.textContent = elapsed.toFixed(2);
        timerEl.classList.remove('masked');
      } else {
        timerEl.textContent = '?.??';
        timerEl.classList.add('masked');
      }

      rafId = requestAnimationFrame(updateDisplay);
    }

    function startGame() {
      isRunning = true;
      startTime = performance.now();
      
      // 重置外觀狀態
      timerEl.className = 'timer-display';
      timerEl.textContent = '0.00';
      messageEl.textContent = '計時中...';
      messageEl.className = 'message';
      diffEl.textContent = '';

      actionBtn.textContent = 'STOP';
      actionBtn.classList.add('running');

      rafId = requestAnimationFrame(updateDisplay);
    }

    function stopGame() {
      isRunning = false;
      cancelAnimationFrame(rafId);

      const rawElapsed = (performance.now() - startTime) / 1000;
      // 固定取小數點後兩位進行判定，確保顯示與判定一致
      const finalTime = Math.round(rawElapsed * 100) / 100;
      const diff = Math.round((finalTime - TARGET_TIME) * 100) / 100;
      const absDiff = Math.abs(diff);

      timerEl.classList.remove('masked');
      timerEl.textContent = finalTime.toFixed(2);

      actionBtn.textContent = 'RETRY';
      actionBtn.classList.remove('running');

      evaluateResult(finalTime, diff, absDiff);
    }

    function evaluateResult(finalTime, diff, absDiff) {
      attemptCount++;
      const sign = diff > 0 ? '+' : '';
      const diffFormatted = `${sign}${diff.toFixed(2)}s`;
      let statusType = '';
      let badgeLabel = '';

      if (absDiff === 0) {
        messageEl.textContent = '完美命中 8.88 秒！神乎其技！';
        messageEl.className = 'message text-perfect';
        timerEl.classList.add('text-perfect');
        diffEl.textContent = '誤差 0.00s';
        statusType = 'perfect';
        badgeLabel = '完美';
      } else if (absDiff <= 0.10) {
        messageEl.textContent = '差一點點......太可惜了！';
        messageEl.className = 'message text-close';
        timerEl.classList.add('text-close');
        diffEl.textContent = `誤差 ${diffFormatted}`;
        statusType = 'close';
        badgeLabel = '差一點';
      } else {
        messageEl.textContent = diff < 0 ? '太早按了，沉住氣！' : '按慢了，已經超過囉！';
        messageEl.className = 'message text-fail';
        diffEl.textContent = `誤差 ${diffFormatted}`;
        statusType = 'fail';
        badgeLabel = diffFormatted;
      }

      // 更新最佳紀錄
      if (absDiff < bestDiff) {
        bestDiff = absDiff;
        bestTimeStr = `${finalTime.toFixed(2)}s (${diff === 0 ? '完美' : diffFormatted})`;
        bestRecordEl.textContent = bestTimeStr;
      }

      // 新增歷史列表
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `
        <span>#${attemptCount} &nbsp; ${finalTime.toFixed(2)}s</span>
        <span class="badge ${statusType}">${badgeLabel}</span>
      `;
      historyListEl.prepend(li);
    }

    function handleTrigger() {
      if (!isRunning) {
        startGame();
      } else {
        stopGame();
      }
    }

    // 滑鼠/觸控點擊事件
    actionBtn.addEventListener('click', () => {
      handleTrigger();
      actionBtn.blur(); // 避免空白鍵重複觸發按鈕預設點擊
    });

    // 鍵盤空白鍵支援
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        handleTrigger();
      }
    });
  </script>
</body>
</html>
